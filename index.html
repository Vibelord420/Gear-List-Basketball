<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TVC Team-App</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b4fb3"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><script src="config.js"></script>
<style>

:root{--bg:#e8f0fb;--sf:#fff;--ink:#0b2247;--mut:#4c6287;--ln:#c5d5ee;--ac:#0b4fb3;--acx:#fff;--ok:#1e8e5a;--okbg:#e1f3ea;--head:#0b4fb3;--p1:#0b4fb3;--p2:#2a72d4;--p3:#5b9be6;--p4:#082f6b;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1730;--sf:#112547;--ink:#e6eefb;--mut:#9fb5d9;--ln:#24437a;--ac:#6aa3e6;--acx:#06122a;--ok:#3cc58a;--okbg:#14352a;--head:#0a3a86;--p1:#1f66cc;--p2:#3b82d6;--p3:#5f9be6;--p4:#0c3b83}}
:root[data-theme="dark"]{--bg:#0a1730;--sf:#112547;--ink:#e6eefb;--mut:#9fb5d9;--ln:#24437a;--ac:#6aa3e6;--acx:#06122a;--ok:#3cc58a;--okbg:#14352a;--head:#0a3a86;--p1:#1f66cc;--p2:#3b82d6;--p3:#5f9be6;--p4:#0c3b83}
[hidden]{display:none!important}
#hdr{background:var(--head);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 22px}
#hdr .wrap{max-width:640px;margin:0 auto}
#shell{max-width:640px;margin:0 auto;padding:18px 16px 48px}
.A{--card:var(--sf);--muted:var(--mut);--line:var(--ln);--blue:var(--ac);--focus:var(--ac);font-family:Barlow,system-ui,sans-serif;line-height:1.5}
.A h1,.A h2,.A h3{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;line-height:1.05;margin:0;letter-spacing:0}
.A h1{font-size:clamp(38px,10.5vw,54px)}
.A h2{font-size:26px}
.A .sub{color:inherit;font-size:16px;margin:10px 0 0;max-width:46ch;opacity:.92}
.A .row{background:none;border:0;padding:0;border-radius:0;align-items:stretch}
.A .btn{flex:none;font:600 16px Barlow,system-ui,sans-serif}
.A label.chk{margin:0}
.A .brand{margin:0 0 12px}
#app .top h1{display:none}
#gate h2{margin-bottom:12px}
.A .top{flex-wrap:wrap}
#app .top{justify-content:flex-end}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:12px 14px 130px}
h1{font-size:30px;font-weight:900;letter-spacing:-.02em;margin:6px 0}
h2{margin:0 0 12px;font-size:20px}
.top{display:flex;justify-content:space-between;align-items:center}
.top div{display:flex;gap:6px}
.sub,.mut{color:var(--mut);font-size:14px;margin:8px 0}
button{font-family:inherit;color:var(--ink)}
.seg{display:flex;background:var(--ln);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--mut);font-weight:700;font-size:16px;padding:11px;border-radius:11px}
.seg .on{background:var(--ac);color:var(--acx)}
.bar{height:10px;background:var(--ln);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);transition:width .2s}
.bar i.ok{background:var(--ok)}
.row{display:flex;align-items:center;gap:12px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;margin:8px 0}
.row.done{background:var(--okbg);border-color:transparent}
.row.done .nm{text-decoration:line-through;color:var(--mut)}
.ck{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;color:#fff;font-weight:900}
.done .ck{background:var(--ok);border-color:var(--ok)}
.ic{font-size:26px;width:32px;text-align:center}
.nm{flex:1;font-weight:600}
.q{display:flex;align-items:center;gap:8px}
.q b{min-width:20px;text-align:center}
.q button,.x{width:34px;height:34px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);font-size:18px}
.x{color:#c0392b}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);font-weight:700;font-size:15px}
.btn.p{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.btn.sm{flex:none;padding:8px 16px}
.w{display:block;width:100%;margin:8px 0}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.dock div{display:flex;gap:8px;max-width:560px;margin:0 auto}
.hc{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px;margin:8px 0}
.acts{display:flex;gap:8px;margin-top:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sh{background:var(--sf);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.in{width:100%;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);font-size:16px;font-family:inherit}
.qr{display:flex;justify-content:space-between;align-items:center;margin:12px 0}
.ig{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:12px;max-height:240px;overflow:auto}
.ic img{width:30px;height:30px;object-fit:contain;vertical-align:middle}
.ig img{width:75%;height:75%;object-fit:contain}
.ig button{aspect-ratio:1;font-size:22px;border-radius:10px;border:2px solid transparent;background:var(--bg);padding:0}
.ig .on{border-color:var(--ac)}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0 12px;font-size:15px}
.wd{display:flex;gap:6px;margin:8px 0 12px}.wd button{flex:1;padding:10px 0;border-radius:10px;border:1px solid var(--ln);background:var(--bg);font-weight:700;font-size:14px}.wd .on{background:var(--ac);border-color:var(--ac);color:var(--acx)}
h3{margin:20px 0 2px;font-size:15px;color:var(--mut)}
h3.cat{display:flex;justify-content:space-between;align-items:baseline}
.nm{min-width:0;overflow-wrap:anywhere}
.row.ed{gap:8px}
.mv{display:flex;gap:4px}.mv button{width:34px;height:34px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);font-size:14px}.mv .off{opacity:.3}
.sgs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.sgs button{padding:8px 12px;border-radius:999px;border:2px solid var(--ln);background:var(--bg);font-size:15px;font-weight:600}.sgs .on{border-color:var(--ac);background:var(--ac);color:var(--acx)}
.tl{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 0;color:var(--mut);font-size:15px}

.A .wrap{max-width:640px;margin:0 auto}
.A .brand{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-family:"Barlow Condensed",Impact,sans-serif;font-weight:600;font-size:20px;opacity:.95}
.A .brand img{height:56px;width:56px;border-radius:50%;flex:none}
.A h1,.A h2,.A h3{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;line-height:1.05;margin:0}
.A h1{font-size:clamp(38px,10.5vw,54px)}
.A h2{font-size:26px}
.A .sub{margin:10px 0 0;max-width:46ch;opacity:.92}
.A .btn{font:600 16px Barlow,system-ui,sans-serif;border:0;border-radius:8px;padding:11px 16px;background:var(--head);color:#fff;cursor:pointer}
.A .btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--line)}
.A .btn.warn{background:#b3261e;color:#fff}
.A .row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.A .chips button{font:500 15px Barlow,system-ui,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.A .chips button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.A .grp{color:var(--muted);font-weight:600;margin:18px 0 6px}
.A .item{display:flex;width:100%;text-align:left;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:8px;padding:12px 14px;margin:0 0 8px;color:var(--ink);font:inherit;cursor:pointer}
.A .item .d{font-weight:600;min-width:112px}
.A .item .t{flex:1;min-width:0;overflow-wrap:anywhere}
.A .badge{font-size:13px;font-weight:600;border-radius:999px;padding:2px 10px;color:#fff;background:var(--c)}
.A .done{color:var(--muted);font-size:13px}
.A .empty{color:var(--muted);padding:20px 0}
.A #mode{color:var(--muted);font-size:14px;margin:18px 0 0}
.A .strip{display:flex;height:44px;border-radius:8px;overflow:hidden;margin:0 0 6px}
.A .strip div{display:flex;align-items:center;padding:0 10px;color:#fff;font-weight:600;font-size:14px;white-space:nowrap}
.A .strip small{font-weight:500;opacity:.9;margin-left:4px}
.A .note{color:var(--muted);font-size:14px;margin:0 0 18px}
.A section{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,var(--blue));border-radius:8px;padding:16px;margin:0 0 14px}
.A section h2 span{color:var(--muted);font-size:18px;font-weight:600;margin-left:6px}
.A .ask{font-weight:600;margin:10px 0 4px}
.A label.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.A label.chk input{margin-top:5px;width:18px;height:18px;accent-color:var(--blue);flex:none}
.A label.f{display:block;font-weight:600;margin:0 0 10px}
.A input[type=date],.A input[type=text],.A select,.A textarea{width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.A textarea{min-height:64px;resize:vertical}
.A .s textarea{min-height:44px}
.A input:focus-visible,.A textarea:focus,.A button:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.A .rules{padding-left:18px;margin:8px 0 0}
.A .rules li{margin:4px 0}
.A #msg{min-height:24px;font-weight:600;color:var(--blue);margin:8px 0}
.A footer{color:var(--muted);font-size:14px;margin-top:24px}
.A .ent{border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0;background:var(--bg)}
.A .ent input,.A .ent select,.A .ent textarea{background:var(--card)}
.A .enth{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.A .btn.sm{padding:5px 10px;font-size:14px}
.A .yl{display:inline-block;margin:8px 0 0;color:var(--blue);font-weight:600}
.A img.pv{max-width:100%;border-radius:6px;margin:8px 0 0;display:block}
.A .lbl{display:block;font-weight:600;margin:10px 0 0}
.A .fb{border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0;background:var(--card)}
.A .fbn{font-weight:700;margin-bottom:4px}
.A .ftxt{white-space:pre-wrap;overflow-wrap:anywhere;margin:2px 0 6px}
.A #pMine textarea{background:var(--card)}
.A input[type=number]{width:100%;margin-top:6px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.A .top{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.A .who{margin-right:auto;font-size:14px;opacity:.95}
.A .who span{font-weight:600}
.A .btn.lt{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.45)}
.A .lang{display:flex;gap:4px}
.A .lang button{font:600 13px Barlow,system-ui,sans-serif;border:1px solid rgba(255,255,255,.55);background:transparent;color:#fff;border-radius:6px;padding:4px 9px;cursor:pointer}
.A .lang button[aria-pressed="true"]{background:#fff;color:#0b4fb3}
.A .hubc{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:8px;padding:16px;margin:0 0 12px;color:var(--ink);font:inherit;cursor:pointer}
.A .hubc h2{font-size:28px}
.A .hubc p{margin:4px 0 0;color:var(--muted)}
.A .gi{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);margin:0 0 6px}
.A .gi input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue);flex:none}
.A .gi .ic{font-size:22px}
.A .gi .nm{flex:1;overflow-wrap:anywhere}
.A .gi.done .nm{text-decoration:line-through;color:var(--muted)}
.A .gi input[type=text],.A .gi input[type=number],.A .gi select{margin:0}
.A .bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin:6px 0 14px}
.A .bar>div{height:100%;background:var(--blue)}
.A .pm{min-height:24px;font-weight:600;color:var(--blue);margin:8px 0}
</style>
</head><body>

  }

  }

}

function tr(s){
  var k=s.trim();if(!k)return s;var v=EN[k];
  if(v===undefined)for(var i=0;i<RX.length;i++){var m=RX[i][0].exec(k);if(m){v=RX[i][1](m);break}}
  return v===undefined?s:s.replace(k,function(){return v});
}

function xa(e){var m=OA.get(e);if(!m){m={};OA.set(e,m)}
  AT.forEach(function(a){if(!e.hasAttribute(a))return;var cv=e.getAttribute(a),o=m[a],src=(o&&o.acur===cv)?o.src:cv,tg=lang==='de'?src:tr(src);if(cv!==tg)e.setAttribute(a,tg);m[a]={src:src,acur:tg}})}
function xw(n){
  if(n.nodeType===3){var p=n.parentNode;if(p&&!/^(TEXTAREA|SCRIPT|STYLE)$/.test(p.nodeName))xt(n);return}
  if(n.nodeType!==1)return;
  if(/^(SCRIPT|STYLE)$/.test(n.nodeName))return;
  xa(n);if(n.nodeName==='TEXTAREA')return;
  for(var c=n.firstChild;c;c=c.nextSibling)xw(c);
}
var obs=new MutationObserver(function(ms){
  ms.forEach(function(r){if(r.type==='childList')r.addedNodes.forEach(xw);else if(r.type==='characterData')xw(r.target);else xa(r.target)});
  obs.takeRecords();
});

/* --- Import der Spiele aus einer HTML-Liste (basketball-bund.net) --- */
function parseSpielplan(src){
  var toks=[];
  if(!/<[a-z!]/i.test(src)){src.split(/\n|\t/).forEach(function(l){l=l.replace(/\s+/g,' ').trim();if(l)toks.push({s:l})})}
  else{
    var doc;try{doc=new DOMParser().parseFromString(src,'text/html')}catch(e){return []}
    doc.querySelectorAll('script,style,noscript,template').forEach(function(n){n.remove()});
    (function walk(n){
      if(n.nodeType===3){var t=n.nodeValue.replace(/\s+/g,' ').trim();if(t)toks.push({s:t});return}
      if(n.nodeType!==1)return;
      if(n.nodeName==='A'){var m=/spiel\/(\d+)/.exec(n.getAttribute('href')||'');if(m)toks.push({id:m[1]})}
      for(var c=n.firstChild;c;c=c.nextSibling)walk(c);
    })(doc.body||doc);
  }
  var DRX=/(\d{1,2})\.(\d{1,2})\.(\d{4}|\d{2})(?!\d)/,TRX=/(?:^|[^\d:])((?:[01]?\d|2[0-3]):[0-5]\d)(?!\d|:)/;
  var STOP=/^(heim|gast|ergebnis|datum|zeit|uhr|spieltag|halle|ort|nr\.?|details?|spielbericht|live|vorschau|tabelle|spielplan|ergebnisse|abgesagt|verlegt|vs\.?|mo|di|mi|do|fr|sa|so|montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)[.,]?$/i;
  var recs=[],cur2=null,md=null;
  function start(){cur2={date:'',time:'',teams:[],mid:'',md:md};recs.push(cur2)}
  function handle(tk){
    if(tk.id){if(!cur2||cur2.mid)start();cur2.mid=tk.id;return}
    var s=tk.s,m;
    if(!tk.sub&&/[|•;]/.test(s)){s.split(/\s*[|•;]\s*/).forEach(function(p){if(p)handle({s:p,sub:1})});return}
    var ms=/(\d{1,2})\s*\.\s*Spieltag|Spieltag\s*(\d{1,2})/i.exec(s);
    if(ms&&!DRX.test(s)){md=+(ms[1]||ms[2]);if(cur2&&!cur2.date&&!cur2.teams.length&&!cur2.mid)cur2.md=md;else cur2=null;return}
    if((m=DRX.exec(s))){
      if(!cur2||cur2.date)start();
      var y=m[3].length===2?'20'+m[3]:m[3];cur2.date=y+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);
      var rs=' '+s.replace(DRX,' '),tm=TRX.exec(rs);if(tm&&!cur2.time)cur2.time=('0'+tm[1]).slice(-5);
      var rest=rs.replace(/(?:^|[^\d:])(?:[01]?\d|2[0-3]):[0-5]\d/g,' ').replace(/\bUhr\b/gi,' ').replace(/\b(mo|di|mi|do|fr|sa|so|montag|dienstag|mittwoch|donnerstag|freitag|samstag|sonntag)\b[.,]?/gi,' ').replace(/[,;]/g,' ').replace(/\s+/g,' ').trim();
      if(rest.length>=5&&!tk.sub)handle({s:rest,sub:1});
      return;
    }
    if(!cur2)return;
    if(!cur2.time&&s.length<=12&&(m=TRX.exec(' '+s))){cur2.time=('0'+m[1]).slice(-5);return}
    if(cur2.teams.length>=2||STOP.test(s)||/^[\d\s:.\-–]+$/.test(s)||s.length<3||/spieltag/i.test(s))return;
    var parts=s.split(/\s+[-–—]\s+/);
    if(!cur2.teams.length&&parts.length===2){cur2.teams=[parts[0].trim(),parts[1].trim()]}else cur2.teams.push(s);
  }
  toks.forEach(handle);
  var seen={};
  return recs.filter(function(r){var k=r.mid||(r.date+r.teams.join('|'));if(!r.date||r.teams.length<2||seen[k])return false;seen[k]=1;return true});
}
function impCompute(){
  impRows.forEach(function(r){
    var t=impTeam.toLowerCase(),h=r.teams[0].toLowerCase(),a=r.teams[1].toLowerCase();
    r.home=h===t?true:a===t?false:null;r.opp=r.home===true?r.teams[1]:r.home===false?r.teams[0]:'';
    if(r.home===null)r.inc=false;else if(r.inc===undefined||r.inc===false&&!r.touched)r.inc=true;
  });
}

    var n=impRows.filter(function(r){return r.inc}).length;
    out.appendChild(el('p',null,impRows.length===1?'1 Spiel gefunden.':impRows.length+' Spiele gefunden.'));
    impRows.forEach(function(r){
      var row=el('div','gi');row.style.flexWrap='wrap';
      var cb=document.createElement('input');cb.type='checkbox';cb.checked=!!r.inc;cb.disabled=r.home===null;cb.setAttribute('aria-label',r.teams.join(' – '));cb.onchange=function(){r.inc=cb.checked;r.touched=true;btn.textContent=cnt()};row.appendChild(cb);
      var dt=mkIn('date',r.date,'',null);dt.style.width='auto';dt.onchange=function(){r.date=dt.value};row.appendChild(dt);
      var tt=mkIn('time',r.time,'',null);tt.style.width='auto';tt.onchange=function(){r.time=tt.value};row.appendChild(tt);
      var mdI=mkIn('number',r.md||'','Spieltag','80px');mdI.onchange=function(){r.md=mdI.value?+mdI.value:null};row.appendChild(mdI);
      var tx=el('div','nm',r.teams[0]+' – '+r.teams[1]);tx.style.flexBasis='100%';row.appendChild(tx);
      row.appendChild(el('div','done',r.home===null?'Nicht beteiligt':(r.home?'Heimspiel':'Auswärtsspiel')));
      out.appendChild(row);
    });
    var btn=el('button','btn');function cnt(){var k=impRows.filter(function(r){return r.inc}).length;return k===1?'1 Spiel importieren':k+' Spiele importieren'}
    btn.textContent=cnt();btn.style.marginTop='10px';
    btn.onclick=async function(){
      var x=cl.fb,list=impRows.filter(function(r){return r.inc&&r.date}),upd=0,have={};termine.forEach(function(t){have[t.id]=1});
      btn.disabled=true;
      try{
        await Promise.all(list.map(function(r){
          var id=r.mid?'g_'+r.mid:'g_'+r.date.replace(/-/g,'')+'_'+(r.teams.join('').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,24));
          if(have[id])upd++;
          var o={type:'spiel',date:r.date,time:TIMERX.test(r.time||'')?r.time:'',title:r.opp,home:r.home,homeTeam:r.teams[0],awayTeam:r.teams[1],matchday:r.md||null,club:impTeam,source:'import'};
          if(r.mid)o.link='https://www.basketball-bund.net/static/#/spiel/'+r.mid;
          return x.F.setDoc(x.F.doc(x.db,'termine',id),o,{merge:true});
        }));
        await x.F.setDoc(x.F.doc(x.db,'config','schedule'),{club:impTeam},{merge:true});
        sSetMsg((list.length===1?'1 Spiel':list.length+' Spiele')+' importiert ('+upd+' aktualisiert).');
      }catch(er){sSetMsg(er&&er.code==='permission-denied'?'Kein Schreibrecht: Nur Trainer dürfen Termine bearbeiten.':'Speichern fehlgeschlagen. Bitte erneut versuchen.');btn.disabled=false}
    };
    out.appendChild(btn);
  }
  rd.onclick=function(){
    var src=(ta2.value.trim()||impHtml||'').trim();impRows=parseSpielplan(src);
    if(!impRows.length){out.textContent='';sSetMsg('Keine Spiele gefunden. Prüfe, ob du die Tabelle mit dem Spielplan kopiert hast.');return}
    sSetMsg('');var seen={};impRows.forEach(function(r){r.teams.forEach(function(t){seen[t]=1})});impTeams=Object.keys(seen).sort();
    var pref=cfg.club&&seen[cfg.club]?cfg.club:impTeams.filter(function(t){return /cannstatt/i.test(t)})[0]||impTeams[0];impTeam=pref;showRows();
  };
}
